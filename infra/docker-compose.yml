# Ecosistemas de Conocimiento — LOCAL ONE-COMMAND DEMO
# =============================================================================
#
#   cd infra && cp .env.example .env && docker compose up -d --wait
#   open http://localhost:3000        (web)
#        http://localhost:3002/admin  (Payload admin + identity provider)
#
# 🔴 NOTHING IN THIS FILE HAS BEEN RUN. It was authored from the Dockerfiles and
#    source in this repo; no `docker compose up`, no `docker build`, no deploy.
#    `docker compose config` PARSES it — that is the only thing verified.
#    Treat every image tag, port, healthcheck and RAM figure as a design, not a
#    measurement. The "Known to be wrong today" list at the bottom is the honest
#    part.
#
# ─── 🔴 THE ONE THING NOT TO "SIMPLIFY": audio-service is THREE containers ──
#    api + transcription worker + CALLBACK worker. Dropping the third breaks the
#    product with no error message anywhere. Full argument in that section.
#
# ─── Why this file lives in `infra/`, and what that costs ────────────────────
# The build context is the REPO ROOT (`context: ..`), NOT this directory. Every
# app here is a pnpm workspace member using `workspace:*` links, so the root
# `pnpm-lock.yaml`, `pnpm-workspace.yaml` and `packages/` must be inside the
# context or `pnpm install --frozen-lockfile` cannot resolve them.
# `apps/web/Dockerfile` and `services/ai-service/Dockerfile` already carry the
# warning in their headers.
#
# ⚠ CONSEQUENCE: Docker reads only the CONTEXT ROOT's `.dockerignore`. With the
#   context at `..`, that is `<repo>/.dockerignore` — `apps/*/.dockerignore` is
#   NOT consulted, so `apps/backend/.dockerignore` is dead weight today.
#   The root `.dockerignore` is REQUIRED and is owned by the integrator, not by
#   this file. It must exclude at minimum `.git`, `node_modules`,
#   `**/node_modules`, `**/dist`, `.env`, `.env.*` — and it must NOT exclude
#   `pnpm-lock.yaml`, `pnpm-workspace.yaml` or any `package.json`.
#   🔴 `node_modules` is a NAMED VOLUME at runtime in the dev overlay — never
#      bind it, never COPY it. That rule is
#      the reason the ignore list exists at all.
#
# ⚠ CONSEQUENCE: if you move this file to the repo root, change every
#   `context: ..` to `context: .` and every `env_file: .env` to
#   `env_file: infra/.env`. Nothing else changes.
#
# ─── No GPU, no cloud credentials ───────────────────────────────────────────
# The default profile runs with `MOCK_LLM=1` and `MOCK_EMBEDDINGS=1`, so the
# stack boots and the UI is clickable with ZERO API keys. Retrieval returns
# deterministic stub vectors — good enough to demo the shape of the product, not
# its answer quality. To demo REAL answers, set `OPENROUTER_API_KEY` in `.env`
# and flip `MOCK_LLM`/`MOCK_EMBEDDINGS` to 0. That is the only paid path.
#
# ─── THREE TIERS — REVISED 2026-08-14 against the real audio-service ────────
# 🔴 Read this before promising anyone a demo.
#
# ⚠ MY PREVIOUS VERSION OF THIS BLOCK WAS WRONG IN ITS FRAMING, and correcting
#   it is more useful than defending it. It said audio was a RAM problem. It is
#   not. RAM is the one resource this stack has plenty of. What audio actually
#   costs is CPU, wall-clock, disk and build time — and those are the numbers
#   that decide whether a live demo is a good idea.
#
# ── Per-container estimates. `limit` is set below; `resident` is a guess. ────
#   service                  limit    idle       during a transcription
#   postgres                 1g       ~150 MB    —
#   redis                    512m     ~30 MB     —
#   ai-service               2g       ~250 MB    —
#   backend                  2g       ~250 MB    —
#   web                      1g       ~50 MB     —
#   audio-service (API)      512m     ~200 MB    ~250 MB
#   audio-service-worker     4g       ~0.9 GB    ~1.8 GB   ← WHISPER_MODEL=small
#                                     ~1.5 GB    ~2.8 GB   ← =large-v3-turbo
#   audio-service-callbacks  256m     ~100 MB    ~100 MB
#   bge-m3-service           4g       ~2.5 GB    (profile heavy)
#   rerank-service           4g       ~2.5 GB    (profile heavy)
#
#   TIER 1 — "core". ~0.8 GB resident. Comfortable on an 8 GB machine.
#       docker compose up -d --wait postgres redis ai-service backend web
#     Document upload, RAG chat, ratings, admin. Everything except audio.
#
#   TIER 2 — "product" (THE DEFAULT). ~1.9 GB idle, ~2.8 GB mid-transcription
#            at WHISPER_MODEL=small. Fits 8 GB; comfortable at 16 GB.
#       docker compose up -d --wait
#     ✅ Audio does NOT push this tier over a RAM threshold. Three containers
#        that together idle around 1.2 GB is not what breaks a laptop.
#     🔴 What it DOES cost, and none of it is RAM:
#        · DISK — the image is ~1.5 GB with `small` weights baked in, ~2.1 GB
#          with `large-v3-turbo`. It is ONE image serving all three containers,
#          so that is paid once, not three times.
#        · FIRST BUILD — ~10 minutes, and it DOWNLOADS the weights (~250 MB for
#          `small`, ~800 MB for `large-v3-turbo`). Needs ~2 GB free RAM during
#          the bake. After that, an app-code edit rebuilds in seconds because
#          the bake layer is cached. 🔴 The first build needs NETWORK; every
#          container start afterwards does not.
#        · CPU — see the wall-clock note below. This is the real one.
#
#   TIER 3 — "heavy". ~7 GB resident. Adds self-hosted embeddings + rerank.
#       docker compose --profile heavy up -d --wait
#     ⚠ CORRECTION to my earlier claim that this "does not fit a 16 GB laptop":
#       ~7 GB resident does fit 16 GB on Linux. Two things still make it a bad
#       idea, and they are both real:
#        · The BUILDS, not the runtime: bge-m3 and rerank each need ~3 GB RAM
#          while constructing their model, and the whisper bake wants ~2 GB.
#        · On Docker Desktop (macOS/Windows) the VM's memory allocation is a
#          HARD CAP and its default is often 8 GB — under which this tier OOMs
#          with a message about the container, not about the VM. Raise it first.
#     🟡 Recommendation unchanged: demo the product locally (tier 2), demo
#        advanced RAG on the `dev` fleet box. That split is deliberate.
#
# ─── 🔴 WHAT A LIVE AUDIO DEMO ACTUALLY FEELS LIKE ──────────────────────────
# CPU transcription is roughly REAL TIME. Not "fast enough" — real time.
#
#   WHISPER_MODEL=small (the default set below)  ≈ 2–4× realtime on ~4 cores
#       → a 10-minute recording finishes in ~3–5 minutes.
#   WHISPER_MODEL=large-v3-turbo (the service's own default)  ≈ 1× realtime
#       → a 10-minute recording takes ~10 minutes. You will be standing there.
#
# 🟡 THEREFORE, AND SAY THIS OUT LOUD BEFORE ANYONE PRESSES UPLOAD:
#    **Do not demo a 10-minute file live.** Keep a 60–90 SECOND Spanish fixture
#    in the room — one voice, clean audio, something whose transcript you can
#    read on screen. That finishes in well under a minute at `small` and it
#    demonstrates the identical pipeline: upload → queue → transcript → signed
#    callback → document ready → the RAG chat citing it.
#    For a longer file, upload it BEFORE the meeting and show the finished
#    document. Nothing about the flow is faked by doing that — transcription is
#    an async queue by design, precisely because it is slow.
#    🔴 What you must not do is start a long transcription in front of an
#       audience and talk over it. The worker takes every core it is allowed
#       (`AUDIO_CPUS`, default 4) and the UI you are demoing gets slower while
#       it runs. That reads as a product bug. It is not one.
#
# ⚠ Every figure above is an ESTIMATE. Sources: the limits set in this file, the
#   model sizes and timings stated in `services/audio-service/README.md`, the
#   sidecar Dockerfiles, and the prototypes' measured per-container
#   footprints. NOTHING HERE WAS MEASURED ON THIS STACK.
#
# =============================================================================

name: edc

# ─── Reusable fragments ─────────────────────────────────────────────────────
x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA TIER
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    # pgvector/pgvector ships stock Postgres + the `vector` extension files.
    # ai-service REQUIRES it (its migration 0000 runs CREATE EXTENSION vector);
    # Payload does not care, and shares the instance to save laptop RAM.
    #
    # 🔴 ONE SERVER, TWO DATABASES — and the second half is not negotiable.
    #    Payload and Drizzle BOTH keep their migration ledger in schema
    #    `public`. Point them at the same database and they clobber each
    #    other's ledger: the symptom is a migration that reports "already
    #    applied" and was not, or a table that vanishes. Separate databases,
    #    shared server. The fleet does the same on the `data` box.
    # ⚠ Pin the minor in the fleet. `pg16` floats and a silent major-compatible
    #   minor bump on a data box is not something you want to discover at 3am.
    image: pgvector/pgvector:pg16
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deliberately `postgres`: the image skips CREATE DATABASE for that name,
      # so BOTH application databases are created by the init script below and
      # there is exactly one place that knows the list.
      POSTGRES_DB: postgres
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:-edc_backend}
      AI_DB_NAME: ${AI_DB_NAME:-edc_ai}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # ⚠ Runs ONCE, only against an empty volume. Editing it later does
      #   nothing until `docker compose down -v`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 55432, not 5432, so the demo never fights a Postgres already running on
      # the host. Matches the default in services/ai-service/.env.example.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      # 🔴 THIS IS THE ONE THAT MATTERS. Payload's boot opens a connection
      #    immediately and does schema push / migrations before it serves; if it
      #    starts against a Postgres that is still in its init phase it crashes,
      #    and under `restart: unless-stopped` it crash-LOOPS rather than
      #    failing visibly. `pg_isready` against the real DB (not `postgres`)
      #    is what makes `condition: service_healthy` below meaningful.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edc} -d ${BACKEND_DB_NAME:-edc_backend}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }

  redis:
    # BullMQ queues (ai-service ingest + audio jobs) and the SSE fan-out bus.
    # 🔴 The fan-out bus is NOT optional the moment there is
    #    more than one replica: an in-process emitter silently produces stale
    #    notifications instead of an error (ADR-0001 D4).
    image: redis:7-alpine
    <<: [*restart, *logging]
    # appendonly so a `docker compose restart` does not drop queued jobs. This
    # is a demo convenience, not a durability claim.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATION TIER
  # ═══════════════════════════════════════════════════════════════════════════

  backend:
    # Next.js + Payload CMS. Domain data AND the identity provider in one app.
    #
    # ✅ `apps/backend/Dockerfile` was rewritten for this monorepo while this
    #    file was being written, and is now correct: repo-root context, pnpm,
    #    no `REGISTRY_PAT`, no private registry scope, `ENV PORT=3002`.
    #    ⚠ One residual difference from `services/ai-service/Dockerfile`: it
    #      copies only FOUR workspace manifests (backend + the three packages),
    #      not all six. pnpm validates `--frozen-lockfile` against EVERY
    #      workspace manifest, so this may fail with "lockfile is not up to
    #      date" — which reads like a lockfile problem and is not one. If the
    #      build fails that way, add `apps/web/package.json` and
    #      `services/ai-service/package.json` to its COPY list.
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      args:
        NODE_VERSION: "22"
    <<: [*restart, *logging]
    env_file: .env
    environment:
      # ── Runtime shape ──
      NODE_ENV: production
      # 🔴 EDC_ENV is the ENVIRONMENT NAME, and it is what gates seeding.
      #    `apps/backend/src/seed/env-gate.ts`: boot-seed runs only for
      #    EDC_ENV ∈ {local, dev}. NODE_ENV carries build semantics ONLY and is
      #    `production` even on the deployed dev box. If the demo database comes
      #    up empty, this variable is the first thing to check — an empty DB is
      #    the gate WORKING.
      EDC_ENV: local
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      # ── Datastore ──
      # ⚠ DATABASE_URI (Payload's spelling), NOT DATABASE_URL (ai-service's).
      #   They are different variables in the same stack. This has bitten people.
      DATABASE_URI: postgres://${POSTGRES_USER:-edc}:${POSTGRES_PASSWORD}@postgres:5432/${BACKEND_DB_NAME:-edc_backend}
      # ✅ MIGRATIONS CREATE THE SCHEMA — here, and in every environment.
      #    The baseline exists (apps/backend/src/migrations/), and the image's
      #    `pnpm start` runs `payload migrate` before `next start`. So this
      #    demo comes up on exactly the schema the fleet runs.
      #    🔴 Do NOT set PAYLOAD_ALLOW_PUSH here to "fix" a schema problem.
      #       Push reconciles the database toward the drizzle schema, which does
      #       NOT contain the four hand-written indexes in the baseline — the
      #       compound UNIQUE constraints behind ratings/memberships/callback
      #       de-duplication. Push removes them without erroring, and the
      #       ratings table quietly starts accepting duplicates.
      #       If the schema needs to change, cut a migration.
      # ── Where it calls out to ──
      AI_SERVICE_URL: http://ai-service:3000
      # 🔴 THE CALLBACK PAIR. ai-service AND audio-service both call BACK to
      #    this URL. It must be an absolute origin reachable FROM those
      #    containers, so the compose service name — not localhost.
      #    Callback path is /api/ai-service/callback (verified:
      #    apps/backend/src/lib/callbackConfig.ts, `CALLBACK_PATH`).
      #    ⚠ `PUBLIC_BACKEND_URL` and `CALLBACK_SECRET` must BOTH be set or
      #      callbacks are silently OFF and every upload sits in `embedding`
      #      forever. There is no error; that is what makes it expensive.
      #    ✅ ONE verifier, ONE secret, TWO emitters. `src/lib/hmac.ts` checks
      #      X-AIService-Timestamp / -Signature / -Event, and audio-service signs
      #      with exactly those headers on purpose, so no new backend code is
      #      needed to authenticate it — only a new `event` branch.
      PUBLIC_BACKEND_URL: http://backend:3002
      # ── audio-service ──
      # ⚠ FORWARD-LOOKING, and I am flagging it rather than hiding it: as of
      #   2026-08-14 `apps/backend/src` reads NEITHER of these yet (grep for
      #   "AUDIO" returns nothing), and its callback route does not branch on
      #   `transcribe.*` — such an event is logged as unknown and 200'd. Another
      #   agent is landing that work per `plan/audio-ingest-integration.md` §3.5,
      #   which names exactly these two variables. They are set here now so the
      #   compose file does not need a second edit; setting an unread variable
      #   costs nothing, and the alternative is a demo that silently does not
      #   ingest audio.
      AUDIO_SERVICE_URL: http://audio-service:8080
      AUDIO_SERVICE_API_KEY: ${AUDIO_SERVICE_API_KEY:?AUDIO_SERVICE_API_KEY is required}
      # `warn` not `strict`: in strict mode a 404 from ai-service's
      # /v1/capabilities THROWS at boot. Fine on a laptop where versions can
      # drift; the fleet should run `strict` so a version skew is loud.
      AI_CAPABILITY_MODE: ${AI_CAPABILITY_MODE:-warn}
      # ── CORS ──
      # The browser talks to web on :3000 and to backend on :3002 directly, so
      # backend must accept the web origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002}
      # ── Rate limiting ──
      # 🔴 0 = trust NOBODY's X-Forwarded-For. Correct when the container is
      #    reached directly, as it is here. Setting this above the real number
      #    of proxies is a total, silent bypass of every per-IP limit
      #    (apps/backend/src/endpoints/http.ts).
      IDENTITY_TRUSTED_PROXY_HOPS: "0"
    volumes:
      # Payload's upload adapter is LOCAL DISK today (verified: no
      # @payloadcms/storage-s3 in apps/backend/package.json, no S3 config in
      # payload.config.ts). A named volume is what makes uploaded documents
      # survive `docker compose restart`.
      # 🔴 FLEET CONSEQUENCE, and it is a real one: local-disk uploads mean the
      #    prod app tier CANNOT be scaled to two boxes — an upload written on
      #    box A is a 404 on box B. See plan/deploy-and-local-demo.md §"Object
      #    storage". This is the single biggest constraint on fleet shape.
      - backend_media:/repo/apps/backend/media
    ports:
      - "${BACKEND_HOST_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      # Not `service_healthy`: backend must tolerate ai-service being down
      # (uploads queue, chat degrades). Requiring health here would make an
      # ai-service problem look like a backend outage.
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3002/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      # Payload's first boot generates the schema and runs the seed. Slow.
      start_period: 120s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  web:
    # SvelteKit, adapter-node. `apps/web/Dockerfile` is ALREADY CORRECT for this
    # compose file — repo-root context, no registry token, workspace-aware. It
    # needs no changes.
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    <<: [*restart, *logging]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # ⚠ These are read via `$env/dynamic/private` — RUNTIME env, not build
      #   args, so one image serves every environment. Do NOT "optimise" them
      #   into build args: Vite SPAs have to build one image per
      #   environment precisely because `import.meta.env.VITE_*` is inlined at
      #   build time. SvelteKit's dynamic/private avoids that trap; keep it.
      #   🔴 Anything renamed to PUBLIC_* becomes build-time-inlined AND
      #      client-visible. Never put a key behind a PUBLIC_ name.
      AI_SERVICE_URL: http://ai-service:3000
      CHAT_BACKEND_URL: http://backend:3002
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
      ai-service:
        condition: service_started
    healthcheck:
      # By contract this route checks nothing downstream — a backend blip must
      # not restart the frontend. (Stated in apps/web/Dockerfile.)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  ai-service:
    # Fastify + Drizzle + BullMQ + pgvector. `services/ai-service/Dockerfile` is
    # ALREADY CORRECT for this compose file and needs no changes.
    #
    # ⚠ Its CMD is `node dist/db/migrate.js && exec node dist/index.js` —
    #   migrations run on EVERY container start, idempotently. That is why it
    #   needs `postgres: service_healthy` and not merely `service_started`.
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    <<: [*restart, *logging]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # ⚠ DATABASE_URL here; DATABASE_URI in backend. Not a typo.
      DATABASE_URL: postgres://${POSTGRES_USER:-edc}:${POSTGRES_PASSWORD}@postgres:5432/${AI_DB_NAME:-edc_ai}
      REDIS_URL: redis://redis:6379
      # 🔴 SAME DRIFT-PROOFING AS audio-service (see that section). The
      #    `callbackSecret` is INTERPOLATED from the single `CALLBACK_SECRET`
      #    variable rather than pasted into a JSON blob in `.env`, because a
      #    pasted copy is the documented #1 failure in this stack: a mismatch
      #    means every ingest callback is rejected and uploads sit in
      #    `embedding` forever, with no error anywhere.
      #    ⚠ This `environment:` value deliberately OVERRIDES anything named
      #      `API_KEYS` in `.env` — Compose gives `environment:` precedence over
      #      `env_file:`. That is why `.env.example` no longer defines it.
      API_KEYS: '{"${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY is required}":{"org":"demo","project":"demo","role":"app","callbackSecret":"${CALLBACK_SECRET:?CALLBACK_SECRET is required}"},"${AI_SERVICE_ADMIN_API_KEY:-dev-key-admin}":{"org":"demo","project":"demo","role":"admin","callbackSecret":"${CALLBACK_SECRET}"}}'
      # ── Advanced RAG: the two optional legs (profile `heavy`) ──
      # Both default OFF, so pointing at a service that is not running is
      # harmless: rerank degrades to a no-op on the fused order, and sparse
      # falls back to the Postgres tsvector lexical leg. Flip the ENABLED flags
      # in `.env` at the same time as you add `--profile heavy`.
      # 🔴 These URLs are consumed VERBATIM — the `/rerank` and `/embed` paths
      #    are part of the value, NOT appended by the client. Dropping the path
      #    yields a 404 that the fallback silently swallows, so the feature
      #    looks enabled and does nothing. Easy to get wrong; check it first.
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_URL: http://rerank-service:8000/rerank
      SPARSE_ENABLED: ${SPARSE_ENABLED:-false}
      SPARSE_EMBED_URL: http://bge-m3-service:8000/embed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AI_SERVICE_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        # Embedding batches and BullMQ workers share this process.
        limits: { cpus: "2.0", memory: 2g }

  # ═══════════════════════════════════════════════════════════════════════════
  # AUDIO TRANSCRIPTION — 🔴 THREE CONTAINERS FROM ONE IMAGE. NOT ONE. NOT TWO.
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # ✅ Reconciled against the REAL service (2026-08-14): its `README.md`,
  #    `Dockerfile`, `.env.example`, `app/config.py`, `app/worker.py` and the
  #    `docker-compose.fragment.yml` its author left for this file. The previous
  #    version of this block was a speculative placeholder written before the
  #    service existed; everything in it that turned out to be wrong (a `/models`
  #    volume, `WHISPER_MODEL_DIR`, `TRANSCRIBE_CONCURRENCY`, `AI_SERVICE_URL`,
  #    a single container) has been deleted rather than adapted.
  #
  # ┌───────────────────────────────────────────────────────────────────────────┐
  # │ 🔴 WHY THERE ARE THREE, AND WHAT HAPPENS IF YOU "SIMPLIFY" IT TO TWO      │
  # │                                                                          │
  # │   audio-service            uvicorn  — HTTP API. No model in RAM.         │
  # │   audio-service-worker     arq WorkerSettings          — transcribes.    │
  # │   audio-service-callbacks  arq CallbackWorkerSettings  — delivers hooks. │
  # │                                                                          │
  # │ DELETING `audio-service-callbacks` BREAKS NOTHING VISIBLY AND BREAKS THE │
  # │ PRODUCT COMPLETELY. Transcriptions still succeed. No error is logged.    │
  # │ The signed webhook is simply never delivered, so `apps/backend` is never │
  # │ told the transcript exists and the document sits un-ready FOREVER.       │
  # │                                                                          │
  # │ It is a SEPARATE PROCESS ON A SEPARATE QUEUE on purpose. The             │
  # │ transcription queue runs ONE job at a time with `job_timeout` of FOUR    │
  # │ HOURS (`app/config.py: JOB_TIMEOUT_SECONDS`). A delivery sharing that    │
  # │ queue would sit behind a running decode — which is precisely the case    │
  # │ `transcribe.progress` events exist to report on. Sharing the queue makes │
  # │ progress events impossible by construction.                              │
  # │                                                                          │
  # │ Same reasoning applies on the fleet: three Coolify apps (or one          │
  # │ docker-compose app), never one. `infra/fleet/env-manifests.md` §4.       │
  # └───────────────────────────────────────────────────────────────────────────┘
  #
  # ── The other four things that break silently if copied wrong ──────────────
  # 1. `audio_work` MUST be mounted on the API **and** the transcription worker.
  #    The API streams the upload to disk; the worker reads it back. Without the
  #    shared volume every job fails with `source_missing`. The callback worker
  #    touches no files and deliberately does not mount it.
  # 2. Both workers set `healthcheck: disable: true`. They have NO HTTP listener,
  #    and the image's inherited curl HEALTHCHECK would mark them permanently
  #    unhealthy — which under `--wait` means `docker compose up` never returns.
  #    The API's `/health/ready` is what reports on the transcription worker: it
  #    503s until that worker publishes a heartbeat with the model loaded.
  # 3. The image is OFFLINE at runtime (`HF_HUB_OFFLINE=1`) and the weights are
  #    BAKED at build time. So `WHISPER_MODEL` must be identical in the build arg
  #    and the environment, or the container tries to download at boot and dies.
  #    That is why both read the SAME `${WHISPER_MODEL}` below. Change it in
  #    `.env` and then `docker compose build` — an env-only change is a boot
  #    failure, not a model switch.
  # 4. `callbackSecret` inside `API_KEYS` must equal the backend's
  #    `CALLBACK_SECRET`. It is not duplicated here — it is INTERPOLATED from the
  #    one variable, so the two cannot drift. See §Shared secret in `.env.example`.

  audio-service:
    # ── HTTP API. Validates, streams the upload to disk, enqueues. No model. ──
    # ⚠ BUILD CONTEXT IS THE SERVICE DIRECTORY, not the repo root — the
    #   exception to this file's rule, and correct: this is a Python service with
    #   no `workspace:*` dependency and deliberately no `package.json`, so it
    #   needs nothing from the root. (Its README explains why adding a
    #   `package.json` would break `pnpm install --frozen-lockfile` for everyone
    #   else.) A repo-root context here would ship the whole monorepo to the
    #   daemon for nothing.
    build: &audio-build
      context: ../services/audio-service
      args:
        # 🔴 MUST equal the WHISPER_MODEL env value below. Same variable, once.
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    # One image, three containers. The tag is shared so Compose builds it ONCE.
    image: edc-audio-service:local
    <<: [*restart, *logging]
    environment: &audio-env
      NODE_ENV: production
      LOG_LEVEL: ${AUDIO_LOG_LEVEL:-INFO}
      # DB 2 keeps audio-service's `audio:`/`arq:` keys visually separate from
      # ai-service's `bull:` keys. They cannot actually collide; this is hygiene.
      REDIS_URL: redis://redis:6379/2
      # 🔴 THE SHARED SECRET, ASSEMBLED HERE SO IT CANNOT DRIFT.
      #    audio-service's `API_KEYS` has the same shape as ai-service's:
      #      apiKey -> {org, project, role, callbackSecret}
      #    Its `callbackSecret` is verified by `apps/backend` with the SAME
      #    verifier and the SAME `CALLBACK_SECRET` it uses for ai-service — that
      #    sharing is deliberate (services/audio-service/app/callbacks.py).
      #    ⚠ A mismatch is SILENT: the backend rejects every callback with a 401
      #      and the document never becomes ready. So the secret is written in
      #      exactly ONE place (`CALLBACK_SECRET` in .env) and interpolated into
      #      both consumers. Never paste a literal secret into this JSON.
      API_KEYS: '{"${AUDIO_SERVICE_API_KEY:?AUDIO_SERVICE_API_KEY is required}":{"org":"demo","project":"demo","role":"app","callbackSecret":"${CALLBACK_SECRET:?CALLBACK_SECRET is required}"},"${AUDIO_SERVICE_ADMIN_API_KEY:-dev-audio-key-admin}":{"org":"demo","project":"demo","role":"admin"}}'
      # ── CPU-ONLY, and that is the whole point ──
      # 🔴 No GPU box is assumed for transcription. The service is built
      #    CPU-first: `cuda` + `float16` is a two-variable flip if a GPU
      #    ever appears, with no code change and no re-bake.
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # Spanish-language product. Pinning the language skips autodetect, which
      # mis-detects short Spanish clips as Portuguese often enough to matter.
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-es}
      AUDIO_WORK_DIR: /var/lib/audio-service
    volumes:
      # See note 1 above. Shared with audio-service-worker, and ONLY with it.
      - audio_work:/var/lib/audio-service
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Container port 8080 (`PORT`, honoured by the image CMD). The backend
      # reaches it as http://audio-service:8080 on the compose network; this
      # mapping exists only so you can curl it from the host.
      - "${AUDIO_HOST_PORT:-3003}:8080"
    healthcheck:
      # ⚠ /health is LIVENESS and touches nothing — a Redis blip must not restart
      #   the container. /health/ready is the one that 503s until a worker has
      #   the model loaded; probe THAT by hand, not from here (rule 2,
      #   infra/fleet/runbook.md §6).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      # 30s, not 300s: this process loads NO model. Do not copy bge-m3's 240s.
      start_period: 30s
      retries: 3
    deploy:
      resources:
        # Genuinely small — it is an I/O-bound uploader with one uvicorn worker.
        limits: { cpus: "1.0", memory: 512m }

  audio-service-worker:
    # ── Holds the model. Does the transcription. THE heavy container. ─────────
    build: *audio-build
    image: edc-audio-service:local
    <<: [*restart, *logging]
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      <<: *audio-env
      # 🔴 Leave at 1. One int8 transcription already saturates every core, and
      #    two at once is SLOWER in total than doing them in sequence.
      MAX_CONCURRENT_JOBS: "1"
      # CTranslate2 intra-op threads. Must not exceed the cpus limit below or the
      # container thrashes. 0 would mean "every core on the host", ignoring the
      # cgroup — which is exactly how a demo machine locks up.
      WHISPER_CPU_THREADS: ${AUDIO_CPUS:-4}
    volumes:
      - audio_work:/var/lib/audio-service
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 🔴 NOT AN OVERSIGHT. No HTTP listener here; the image's inherited curl
      #    healthcheck would fail forever and hang `up --wait`. See note 2.
      disable: true
    deploy:
      resources:
        limits:
          # 🔴 THE ONLY LIMIT IN THIS FILE THAT PROTECTS THE DEMO ITSELF.
          #    Without it, a transcription takes every core and the UI you are
          #    demoing goes unresponsive — which looks like a product bug in
          #    front of an audience. Raise AUDIO_CPUS/AUDIO_MEMORY in `.env` on
          #    a bigger machine; keep WHISPER_CPU_THREADS equal to AUDIO_CPUS.
          cpus: "${AUDIO_CPUS:-4}"
          memory: ${AUDIO_MEMORY:-4g}

  audio-service-callbacks:
    # ── Delivers the HMAC-signed webhooks. Same image, no model, ~100 MB. ─────
    # 🔴🔴 DO NOT DELETE THIS SERVICE. Read the box at the top of this section.
    #      Removing it does not produce an error. It produces documents that
    #      transcribe successfully and then never become ready, forever.
    build: *audio-build
    image: edc-audio-service:local
    <<: [*restart, *logging]
    command: ["arq", "app.worker.CallbackWorkerSettings"]
    environment:
      <<: *audio-env
      # No WHISPER_* is needed — this process never loads a model — but they are
      # inherited harmlessly from the anchor and keep the three containers'
      # config identical, which is one less thing to diff at 3am.
      # No AUDIO_WORK_DIR volume either: deliveries read from Redis, not disk.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        # Pure outbound HTTP. `CALLBACK_WORKER_MAX_JOBS` defaults to 8.
        limits: { cpus: "0.5", memory: 256m }

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL — self-hosted inference sidecars (profile: heavy)
  # ═══════════════════════════════════════════════════════════════════════════
  # Both are CPU-only by design and BAKE their weights into the image at build
  # time (see their Dockerfiles), so they need no model volume — but the build
  # itself downloads ~2.3 GB each and needs ~3 GB RAM. Off by default.

  bge-m3-service:
    profiles: ["heavy"]
    build:
      # No workspace deps — its own directory is the correct, much smaller
      # context. This is the exception to the repo-root rule above.
      context: ../services/ai-service/bge-m3-service
    <<: [*restart, *logging]
    expose: ["8000"]
    ports:
      - "${BGE_HOST_PORT:-8001}:8000"
    healthcheck:
      # ⚠ /health is liveness; /ready reports 200 only AFTER the ~2.3 GB model
      #   is loaded into RAM. Probe /ready, or ai-service starts calling a
      #   service that is up and not yet answering.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 240s
      retries: 3
    deploy:
      resources:
        # One worker, one ~2.3 GB model copy in RAM (its Dockerfile is explicit
        # that a second worker doubles that).
        limits: { cpus: "4.0", memory: 4g }

  rerank-service:
    profiles: ["heavy"]
    build:
      context: ../services/ai-service/rerank-service
    <<: [*restart, *logging]
    expose: ["8000"]
    ports:
      - "${RERANK_HOST_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 240s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 4g }

# ═══════════════════════════════════════════════════════════════════════════
volumes:
  pg_data:          # Postgres cluster — both databases.
  redis_data:       # BullMQ queue state (appendonly).
  backend_media:    # Payload uploads. Local disk today; see §Object storage.
  # Transient audio only: the upload awaiting transcription, plus per-job
  # scratch. Both are deleted the moment a transcript exists, and swept on a
  # timer if a crash skipped that. Safe to `docker volume rm` at any time — you
  # lose only in-flight jobs.
  # 🔴 There is NO model-weights volume, and that is deliberate. The weights are
  #    BAKED INTO THE IMAGE at build time (`scripts/bake_model.py`, then
  #    `HF_HUB_OFFLINE=1`), so a container start never touches the network and
  #    the demo works offline. A named volume at /opt/whisper-cache would be
  #    seeded from the image on FIRST use only and then go sticky — so a rebuild
  #    with a different WHISPER_MODEL would silently keep serving the OLD
  #    weights until someone ran `docker volume rm`. The previous version of
  #    this file had exactly that volume (`whisper_models:/models`); it was a
  #    guess, and it was the wrong one.
  audio_work:

networks:
  default:
    name: edc

