# Ecosistemas de Conocimiento — CORE STACK (local AND Coolify)
# =============================================================================
#
#   cd infra && cp .env.example .env && docker compose up -d --wait
#   open http://localhost:45400        (web)
#        http://localhost:45402/admin  (Payload admin + identity provider)
#
# ─── ONE FILE, TWO CONSUMERS ────────────────────────────────────────────────
#   docker-compose.yml           THIS FILE. What Coolify deploys. No host
#                                ports, no fixed network or project name, no
#                                path outside the repo, every public URL from
#                                env. Two copies of it run side by side on one
#                                box (dev + staging) without colliding.
#   docker-compose.override.yml  LOCAL ONLY. `docker compose` loads it
#                                automatically when no `-f` is given. Adds
#                                `name: edc`, the 454xx host ports, the fixed
#                                `edc` network and the corpus mount.
#   docker-compose.audio.yml     OPT-IN. The three audio containers + the
#                                backend's audio wiring. Not deployed yet.
#   docker-compose.dev.yml       Hot-reload overlay (see its header).
#
#   Local with audio:
#     docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                    -f docker-compose.audio.yml up -d --wait
#   What Coolify sees (check before pushing):
#     docker compose -f docker-compose.yml config
#   Coolify setup and per-environment variables: infra/fleet/env-manifests.md.
#
# 🔴 ALMOST NOTHING IN THIS FILE HAS BEEN RUN. It was authored from the
#    Dockerfiles and source in this repo; no `docker compose up`, no
#    `docker build`, no deploy. `docker compose config` PARSES it — that is
#    what is verified for every service except one.
#    ✅ THE EXCEPTION IS `rustfs`. That image was pulled and stood up on a
#       throwaway port on 2026-08-14, and its S3 API, admin API, console path,
#       healthcheck body and idle memory were measured against the running
#       container. Those specific lines are marked ✅ MEASURED where they
#       appear. Nothing else here is.
#    Treat every other image tag, port, healthcheck and RAM figure as a design,
#    not a measurement. The "Known to be wrong today" list at the bottom is the
#    honest part.
#
# ─── 🔴 THE ONE THING NOT TO "SIMPLIFY": audio-service is THREE containers ──
#    api + transcription worker + CALLBACK worker. Dropping the third breaks the
#    product with no error message anywhere. Full argument in that section.
#
# ─── Why this file lives in `infra/`, and what that costs ────────────────────
# The build context is the REPO ROOT (`context: ..`), NOT this directory. Every
# app here is a pnpm workspace member using `workspace:*` links, so the root
# `pnpm-lock.yaml`, `pnpm-workspace.yaml` and `packages/` must be inside the
# context or `pnpm install --frozen-lockfile` cannot resolve them.
# `apps/web/Dockerfile` and `services/ai-service/Dockerfile` already carry the
# warning in their headers.
#
# ⚠ CONSEQUENCE: Docker reads only the CONTEXT ROOT's `.dockerignore`. With the
#   context at `..`, that is `<repo>/.dockerignore` — `apps/*/.dockerignore` is
#   NOT consulted, so `apps/backend/.dockerignore` is dead weight today.
#   The root `.dockerignore` is REQUIRED and is owned by the integrator, not by
#   this file. It must exclude at minimum `.git`, `node_modules`,
#   `**/node_modules`, `**/dist`, `.env`, `.env.*` — and it must NOT exclude
#   `pnpm-lock.yaml`, `pnpm-workspace.yaml` or any `package.json`.
#   🔴 `node_modules` is a NAMED VOLUME at runtime in the dev overlay — never
#      bind it, never COPY it. That rule is
#      the reason the ignore list exists at all.
#
# ⚠ CONSEQUENCE: if you move this file to the repo root, change every
#   `context: ..` to `context: .` and every `env_file: .env` to
#   `env_file: infra/.env`. Nothing else changes.
#
# ─── No GPU, no cloud credentials ───────────────────────────────────────────
# The default profile runs with `MOCK_LLM=1` and `MOCK_EMBEDDINGS=1`, so the
# stack boots and the UI is clickable with ZERO API keys. Retrieval returns
# deterministic stub vectors — good enough to demo the shape of the product, not
# its answer quality. To demo REAL answers, set `OPENROUTER_API_KEY` in `.env`
# and flip `MOCK_LLM`/`MOCK_EMBEDDINGS` to 0. That is the only paid path.
#
# ─── THREE TIERS — REVISED 2026-08-14 against the real audio-service ────────
# 🔴 Read this before promising anyone a demo.
#
# ⚠ MY PREVIOUS VERSION OF THIS BLOCK WAS WRONG IN ITS FRAMING, and correcting
#   it is more useful than defending it. It said audio was a RAM problem. It is
#   not. RAM is the one resource this stack has plenty of. What audio actually
#   costs is CPU, wall-clock, disk and build time — and those are the numbers
#   that decide whether a live demo is a good idea.
#
# ── Per-container estimates. `limit` is set below; `resident` is a guess. ────
#   service                  limit    idle       during a transcription
#   postgres                 1g       ~150 MB    —
#   redis                    512m     ~30 MB     —
#   rustfs                   1g       ~100 MB    —   ← ✅ MEASURED, empty store
#   ai-service               2g       ~250 MB    —
#   backend                  2g       ~250 MB    —
#   web                      1g       ~50 MB     —
#   audio-service (API)      512m     ~200 MB    ~250 MB
#   audio-service-worker     4g       ~0.9 GB    ~1.8 GB   ← WHISPER_MODEL=small
#                                     ~1.5 GB    ~2.8 GB   ← =large-v3-turbo
#   audio-service-callbacks  256m     ~100 MB    ~100 MB
#   bge-m3-service           4g       ~2.5 GB    (profile heavy)
#   rerank-service           4g       ~2.5 GB    (profile heavy)
#
#   TIER 1 — "core". ~0.9 GB resident. Comfortable on an 8 GB machine.
#       docker compose up -d --wait postgres redis rustfs ai-service backend web
#     Document upload, RAG chat, ratings, admin. Everything except audio.
#     ⚠ REVISED 2026-08-14 with rustfs added: +~100 MB measured resident, and
#       +1 GB of ceiling. `rustfs` is IN this tier, not behind a profile — the
#       argument is in §OBJECT STORAGE below and it is a real trade, not a
#       formality. You can leave it off the command line: `backend`
#       `depends_on` it, so Compose starts it either way.
#
#   TIER 2 — "product" (THE DEFAULT). ~2.0 GB idle, ~2.9 GB mid-transcription
#            at WHISPER_MODEL=small. Fits 8 GB; comfortable at 16 GB.
#       docker compose up -d --wait
#     ✅ Audio does NOT push this tier over a RAM threshold. Three containers
#        that together idle around 1.2 GB is not what breaks a laptop.
#     🔴 What it DOES cost, and none of it is RAM:
#        · DISK — the image is ~1.5 GB with `small` weights baked in, ~2.1 GB
#          with `large-v3-turbo`. It is ONE image serving all three containers,
#          so that is paid once, not three times.
#        · FIRST BUILD — ~10 minutes, and it DOWNLOADS the weights (~250 MB for
#          `small`, ~800 MB for `large-v3-turbo`). Needs ~2 GB free RAM during
#          the bake. After that, an app-code edit rebuilds in seconds because
#          the bake layer is cached. 🔴 The first build needs NETWORK; every
#          container start afterwards does not.
#        · CPU — see the wall-clock note below. This is the real one.
#
#   TIER 3 — "heavy". ~7 GB resident. Adds self-hosted embeddings + rerank.
#       docker compose --profile heavy up -d --wait
#     ⚠ CORRECTION to my earlier claim that this "does not fit a 16 GB laptop":
#       ~7 GB resident does fit 16 GB on Linux. Two things still make it a bad
#       idea, and they are both real:
#        · The BUILDS, not the runtime: bge-m3 and rerank each need ~3 GB RAM
#          while constructing their model, and the whisper bake wants ~2 GB.
#        · On Docker Desktop (macOS/Windows) the VM's memory allocation is a
#          HARD CAP and its default is often 8 GB — under which this tier OOMs
#          with a message about the container, not about the VM. Raise it first.
#     🟡 Recommendation unchanged: demo the product locally (tier 2), demo
#        advanced RAG on the `dev` fleet box. That split is deliberate.
#
# ─── 🔴 WHAT A LIVE AUDIO DEMO ACTUALLY FEELS LIKE ──────────────────────────
# CPU transcription is roughly REAL TIME. Not "fast enough" — real time.
#
#   WHISPER_MODEL=small (the default set below)  ≈ 2–4× realtime on ~4 cores
#       → a 10-minute recording finishes in ~3–5 minutes.
#   WHISPER_MODEL=large-v3-turbo (the service's own default)  ≈ 1× realtime
#       → a 10-minute recording takes ~10 minutes. You will be standing there.
#
# 🟡 THEREFORE, AND SAY THIS OUT LOUD BEFORE ANYONE PRESSES UPLOAD:
#    **Do not demo a 10-minute file live.** Keep a 60–90 SECOND Spanish fixture
#    in the room — one voice, clean audio, something whose transcript you can
#    read on screen. That finishes in well under a minute at `small` and it
#    demonstrates the identical pipeline: upload → queue → transcript → signed
#    callback → document ready → the RAG chat citing it.
#    For a longer file, upload it BEFORE the meeting and show the finished
#    document. Nothing about the flow is faked by doing that — transcription is
#    an async queue by design, precisely because it is slow.
#    🔴 What you must not do is start a long transcription in front of an
#       audience and talk over it. The worker takes every core it is allowed
#       (`AUDIO_CPUS`, default 4) and the UI you are demoing gets slower while
#       it runs. That reads as a product bug. It is not one.
#
# ⚠ Every figure above is an ESTIMATE, with ONE exception now: the rustfs idle
#   number is measured (see below). Other sources: the limits set in this file,
#   the model sizes and timings stated in `services/audio-service/README.md`,
#   and the sidecar Dockerfiles. NOTHING ELSE HERE WAS MEASURED ON THIS STACK.
#
# ─── ☁ OBJECT STORAGE — WHY IT IS IN THE CORE TIER, NOT BEHIND A PROFILE ────
# 🟡 This was a real decision with a cost on both sides. The call: **core**.
#
# THE CASE FOR A PROFILE: it is ~100 MB resident and 1 GB of ceiling on the
# tier everyone claims fits 8 GB, for a capability a five-minute demo may never
# touch. `heavy` exists precisely for "real but optional".
#
# 🔴 THE CASE FOR CORE, WHICH WON, AND THE SECOND REASON IS THE DECIDING ONE:
#
#  1. UPLOADS ARE THE PRODUCT. This is a content repository. A tier that
#     cannot accept a file is not a reduced demo, it is a different product.
#     `heavy` holds `bge-m3` and `rerank` — things that make retrieval BETTER.
#     Storage makes it EXIST. Those do not belong in the same bucket.
#     And it is audio that forced this: at 10–100× the size of a PDF, local
#     disk stopped being viable, which is why we are here at all.
#
#  2. 🔴 A PROFILE WOULD PUT THE SERVICE AND ITS CONFIGURATION BEHIND TWO
#     SEPARATE SWITCHES THAT MUST AGREE. Compose profiles gate SERVICES. They
#     do not gate the `S3_*` variables the backend reads from `.env`. So
#     `--profile storage` off + the variables still set = a backend pointed at
#     a host that is not running: uploads fail against a store nobody started.
#     Turning it on would mean remembering BOTH. This file already carries
#     three documented instances of the same shape — the callback secret, the
#     WHISPER_MODEL build-arg/env pair, the `RERANK_ENABLED`/URL pair — and in
#     all three the fix was to collapse it to one switch. Adding a fourth
#     two-switch trap, for 100 MB, is a bad trade at any RAM price.
#
#  ✅ The single switch that remains: comment the five `S3_*` lines out of
#     `.env` and the backend falls back to local disk on the `backend_media`
#     volume. `rustfs` still starts (it is `depends_on` of `backend`) and sits
#     there idle at ~100 MB. 🔧 If that 100 MB matters, `docker compose stop
#     rustfs` after the stack is up. That is the honest cost of this choice and
#     it is the whole of it.
#
# ✅ DECIDED 2026-10-14 (owner): RustFS is the file store in EVERY
#   environment — local, dev and staging. It runs inside this compose file,
#   internal only (no host port, no public domain); files are served THROUGH
#   the backend. Older text calling it "local and dev only" is superseded.
#
# =============================================================================

# No top-level `name:` here on purpose. Coolify sets the project name per
# resource; locally docker-compose.override.yml sets `name: edc`, which keeps
# the existing `edc_*` volumes.

# ─── Reusable fragments ─────────────────────────────────────────────────────
x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA TIER
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    # pgvector/pgvector ships stock Postgres + the `vector` extension files.
    # ai-service REQUIRES it (its migration 0000 runs CREATE EXTENSION vector);
    # Payload does not care, and shares the instance to save laptop RAM.
    #
    # 🔴 ONE SERVER, TWO DATABASES — and the second half is not negotiable.
    #    Payload and Drizzle BOTH keep their migration ledger in schema
    #    `public`. Point them at the same database and they clobber each
    #    other's ledger: the symptom is a migration that reports "already
    #    applied" and was not, or a table that vanishes. Separate databases,
    #    shared server. The fleet does the same on the `data` box.
    # ⚠ Pin the minor in the fleet. `pg16` floats and a silent major-compatible
    #   minor bump on a data box is not something you want to discover at 3am.
    # The image is `pgvector/pgvector:pg16` plus the init script baked in
    # (infra/postgres/Dockerfile). Baked, not bind-mounted: Coolify does not
    # bind-mount files from the git checkout, so a `./postgres/init` mount
    # would arrive empty and only the `postgres` database would exist.
    build:
      context: ./postgres
    image: edc-postgres:pg16-${EDC_ENV:-local}
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deliberately `postgres`: the image skips CREATE DATABASE for that name,
      # so BOTH application databases are created by the init script below and
      # there is exactly one place that knows the list.
      POSTGRES_DB: postgres
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:-edc_backend}
      AI_DB_NAME: ${AI_DB_NAME:-edc_ai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # ⚠ The init script runs ONCE, only against an empty volume. Editing it
    #   later does nothing until `docker compose down -v`.
    # Host ports for every service live in docker-compose.override.yml.
    healthcheck:
      # 🔴 THIS IS THE ONE THAT MATTERS. Payload's boot opens a connection
      #    immediately and does schema push / migrations before it serves; if it
      #    starts against a Postgres that is still in its init phase it crashes,
      #    and under `restart: unless-stopped` it crash-LOOPS rather than
      #    failing visibly. `pg_isready` against the real DB (not `postgres`)
      #    is what makes `condition: service_healthy` below meaningful.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edc} -d ${BACKEND_DB_NAME:-edc_backend}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }

  redis:
    # BullMQ queues (ai-service ingest + audio jobs) and the SSE fan-out bus.
    # 🔴 The fan-out bus is NOT optional the moment there is
    #    more than one replica: an in-process emitter silently produces stale
    #    notifications instead of an error (ADR-0001 D4).
    image: redis:7-alpine
    <<: [*restart, *logging]
    # appendonly so a `docker compose restart` does not drop queued jobs. This
    # is a demo convenience, not a durability claim.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  rustfs:
    # ── S3-compatible object storage. Payload's upload target. ────────────────
    #
    # WHY IT IS HERE AT ALL: users upload PDFs, DOCX and **audio**. Audio is
    # 10–100× the size of a PDF, and that is what took local-disk uploads from
    # "a fleet constraint" to "does not work". The `backend_media` volume below
    # is still declared, and is still the fallback — see the `backend` service.
    #
    # ✅ USED IN EVERY ENVIRONMENT (owner decision 2026-10-14), which
    #    supersedes the "local and dev only" call in infra/fleet/topology.md §3.
    #    The risks that call rested on still stand and are worth knowing:
    #    RustFS ships frequent CVEs, every release is flagged `prerelease`, and
    #    it has open issues for silent data loss on single-drive — exactly this
    #    topology. Back the volume up (infra/fleet/backups.md).
    #
    # 🔴 PINNED, and this is not pedantry. A floating tag such as
    #    `minio/minio:latest` can leave a stack on an ARCHIVED,
    #    unpatched image without anyone deciding to. An RC image behind a
    #    floating tag is the same mistake with a faster clock.
    image: rustfs/rustfs:1.0.0-rc.1
    <<: [*restart, *logging]
    environment:
      # 🔴 THE ROOT CREDENTIALS, AND THEY ARE THE SAME VALUE THE APP USES.
      #    Written ONCE in `.env` and interpolated into both sides here, exactly
      #    like CALLBACK_SECRET, so the store's root key and the backend's
      #    S3_ACCESS_KEY_ID physically cannot drift.
      #    ⚠ WHY ROOT AND NOT A SCOPED USER: RustFS's IAM store lives on the
      #      DATA VOLUME and NOTHING seeds a user or a policy from the
      #      environment. Only these two root variables exist. A scoped user has
      #      to be created through the admin API against a running server — that
      #      is the provisioning script (`apps/backend/**`, another agent), and
      #      until it has run, root is the only identity that exists. Local
      #      demo: root is fine, every credential in `.env` is fake anyway.
      #    ⚠ DEFAULTED, NOT `:?`-REQUIRED, AND THAT IS DELIBERATE. Every other
      #      credential in this file uses `${VAR:?…}` so a missing value is a
      #      loud failure. Here that would break the documented local-disk
      #      fallback: turning object storage off means commenting all five
      #      `S3_*` lines out of `.env`, and a `:?` guard would then refuse to
      #      start the whole stack. So the store keeps a working root key even
      #      when the app is not configured to use it. The value below is fake
      #      and identical for everyone who clones this repo — same rule as the
      #      rest of `.env.example`: safe only because this binds to localhost.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-edclocal}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-edclocal_secret_not_for_any_real_env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    volumes:
      # 🔴 THIS VOLUME HOLDS TWO DIFFERENT KINDS OF THING, and conflating them
      #    is the backup mistake. (a) the bucket data — the actual uploaded
      #    bytes; (b) the IAM store — users, access keys, policies.
      #    ⚠ `users.json` inside it holds SECRET KEYS IN CLEARTEXT. Anyone with
      #      read access to this volume, or to a copy of it, has every key it
      #      has ever issued. Locally that is a fake key. On `dev` it is not,
      #      and it is the reason a volume copy is a credential leak.
      #    🔴 A volume RESTORE recreates the buckets and DOES NOT recreate the
      #      IAM store as the app expects it — see infra/fleet/backups.md.
      #      Provisioning must be re-runnable for exactly that reason.
      - rustfs_data:/data
    healthcheck:
      # 🔴 READ THIS BEFORE YOU TRUST A GREEN CONTAINER.
      #    `/health` and `/health/ready` on RustFS are LIVENESS ONLY, and they
      #    ANSWER OK WHILE THE STORE IS UNUSABLE.
      #    ✅ Measured on this exact image, 2026-08-14: `/health` returns
      #       `{"status":"ok","ready":true,"service":"rustfs-endpoint",…}`
      #       — a hardcoded-looking shape that reports `ready:true` before any
      #       bucket exists and does not consult the store.
      #    ✅ Also measured on RustFS: 200 from
      #       `/health` with `"ready":true` while EVERY S3 call returned 503.
      #    The field is named `ready` and it is not a readiness signal.
      #
      #    So what this healthcheck proves is EXACTLY ONE THING: the process is
      #    up and something is listening on 9000. It proves nothing about
      #    whether a bucket exists, whether credentials work, or whether a PUT
      #    would succeed. It is wired anyway because `depends_on:
      #    service_healthy` on `backend` then means "the port is bound" instead
      #    of "the container was created", which removes a boot-time
      #    ECONNREFUSED storm. That is its whole value.
      #
      #    ✅ THE REAL STORAGE PROBE IS `HeadBucket` AGAINST THE REAL BUCKET,
      #       and it lives in the backend's readiness endpoint
      #       (`apps/backend/**`, another agent's file). Measured
      #       at p50 1.03 ms, and it caught every induced failure
      #       that `/health` missed. `infra/fleet/runbook.md` §6 rule 5: probe a
      #       dependency by DOING the thing you need, not by asking how it feels.
      #    ⚠ This is how a 200 hides a 20-hour outage, and worse,
      #      because the endpoint has a reassuring name.
      #
      # ✅ `CMD-SHELL` + `curl` is SAFE HERE, and that is worth stating because
      #    it is not safe on every storage image. Verified inside this
      #    container: `/usr/bin/curl`, `/usr/bin/wget` and `/usr/bin/nc` all
      #    exist. 🔴 Garage — the engine `infra/fleet/topology.md` §3 names for
      #    a self-hosted stage/prod — is `FROM scratch` with NO SHELL and NO
      #    CURL, so a `CMD-SHELL` healthcheck cannot run there at all and must
      #    be exec form (`["/garage","status"]`). Do not copy this line across
      #    engines without checking.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # ⚠ 1 GB, CHOSEN DELIBERATELY, AND THE NUMBER MATTERS MORE THAN USUAL.
          #   RustFS open issue #2573: its memory use climbs toward whatever
          #   ceiling the container has, where other stores held far less. So
          #   the limit is not a safety net that will never be touched — it is
          #   the number RustFS will grow into. Setting it high is not
          #   generous, it is a decision to give away that much RAM.
          #   1 GB is picked to be: comfortably above the multipart buffering a
          #   100 MB audio upload needs (parts are ~5–16 MB), and low enough
          #   that it cannot crowd out `audio-service-worker` (4 GB) on an 8 GB
          #   laptop. It adds ~1 GB of CEILING to tier 1.
          #   ✅ MEASURED idle on this image, empty store, no limit applied:
          #      **102 MiB**. That is the floor, not the expectation — #2573 is
          #      precisely the claim that the number does not stay there.
          #   🔧 If RustFS gets OOM-killed under a real upload load, raise
          #      RUSTFS_MEMORY rather than removing the limit — and note that an
          #      OOM here IS the #2573 symptom, not a mystery.
          memory: ${RUSTFS_MEMORY:-1g}

  # ═══════════════════════════════════════════════════════════════════════════
  # APPLICATION TIER
  # ═══════════════════════════════════════════════════════════════════════════

  backend:
    # Next.js + Payload CMS. Domain data AND the identity provider in one app.
    #
    # ✅ `apps/backend/Dockerfile` was rewritten for this monorepo while this
    #    file was being written, and is now correct: repo-root context, pnpm,
    #    no `REGISTRY_PAT`, no private registry scope, `ENV PORT=3002`.
    #    ⚠ One residual difference from `services/ai-service/Dockerfile`: it
    #      copies only FOUR workspace manifests (backend + the three packages),
    #      not all six. pnpm validates `--frozen-lockfile` against EVERY
    #      workspace manifest, so this may fail with "lockfile is not up to
    #      date" — which reads like a lockfile problem and is not one. If the
    #      build fails that way, add `apps/web/package.json` and
    #      `services/ai-service/package.json` to its COPY list.
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      args:
        NODE_VERSION: "22"
    <<: [*restart, *logging]
    env_file: .env
    environment:
      # ── Runtime shape ──
      NODE_ENV: production
      # 🔴 EDC_ENV is the ENVIRONMENT NAME, and it is what gates seeding.
      #    `apps/backend/src/seed/env-gate.ts`: boot-seed runs only for
      #    EDC_ENV ∈ {local, dev}. NODE_ENV carries build semantics ONLY and is
      #    `production` even on the deployed dev box. If the demo database comes
      #    up empty, this variable is the first thing to check — an empty DB is
      #    the gate WORKING.
      #    Required, no default: `local` (override/.env), `dev`, `stage`.
      EDC_ENV: ${EDC_ENV:?EDC_ENV is required (local | dev | stage)}
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      # ── Datastore ──
      # ⚠ DATABASE_URI (Payload's spelling), NOT DATABASE_URL (ai-service's).
      #   They are different variables in the same stack. This has bitten people.
      DATABASE_URI: postgres://${POSTGRES_USER:-edc}:${POSTGRES_PASSWORD}@postgres:5432/${BACKEND_DB_NAME:-edc_backend}
      # ✅ MIGRATIONS CREATE THE SCHEMA — here, and in every environment.
      #    The baseline exists (apps/backend/src/migrations/), and the image's
      #    `pnpm start` runs `payload migrate` before `next start`. So this
      #    demo comes up on exactly the schema the fleet runs.
      #    🔴 Do NOT set PAYLOAD_ALLOW_PUSH here to "fix" a schema problem.
      #       Push reconciles the database toward the drizzle schema, which does
      #       NOT contain the four hand-written indexes in the baseline — the
      #       compound UNIQUE constraints behind ratings/memberships/callback
      #       de-duplication. Push removes them without erroring, and the
      #       ratings table quietly starts accepting duplicates.
      #       If the schema needs to change, cut a migration.
      # ── Where it calls out to ──
      AI_SERVICE_URL: http://ai-service:3000
      # 🔴 THE CALLBACK PAIR. ai-service AND audio-service both call BACK to
      #    this URL. It must be an absolute origin reachable FROM those
      #    containers, so the compose service name — not localhost.
      #    Callback path is /api/ai-service/callback (verified:
      #    apps/backend/src/lib/callbackConfig.ts, `CALLBACK_PATH`).
      #    ⚠ `PUBLIC_BACKEND_URL` and `CALLBACK_SECRET` must BOTH be set or
      #      callbacks are silently OFF and every upload sits in `embedding`
      #      forever. There is no error; that is what makes it expensive.
      #    ✅ ONE verifier, ONE secret, TWO emitters. `src/lib/hmac.ts` checks
      #      X-AIService-Timestamp / -Signature / -Event, and audio-service signs
      #      with exactly those headers on purpose, so no new backend code is
      #      needed to authenticate it — only a new `event` branch.
      PUBLIC_BACKEND_URL: http://backend:3002
      # ── audio-service — OFF unless docker-compose.audio.yml is added ──
      # Empty here on purpose. The backend treats an empty URL or key as
      # "audio not configured" and says so: it logs it at boot
      # (`checkAudioServiceConfig`, apps/backend/src/lib/audioClient.ts) and
      # fails each audio upload with a visible error. PDF/DOCX are unaffected.
      # docker-compose.audio.yml sets both and REQUIRES the key.
      AUDIO_SERVICE_URL: ""
      AUDIO_SERVICE_API_KEY: ""
      # `warn` not `strict`: in strict mode a 404 from ai-service's
      # /v1/capabilities THROWS at boot. Fine on a laptop where versions can
      # drift; the fleet should run `strict` so a version skew is loud.
      AI_CAPABILITY_MODE: ${AI_CAPABILITY_MODE:-warn}
      # ── Seed corpus ──
      # No CORPUS_DIR here: the corpus is a sibling repo, absent from a Coolify
      # checkout. Locally docker-compose.override.yml mounts it and sets
      # CORPUS_DIR. Without it the seed degrades to an empty library and logs
      # why (apps/backend/src/seed/corpusSource.ts) — it does not crash.
      # 🔴 EMBEDDING THE CORPUS IS OPT-IN, AND IT STAYS OFF HERE. Set to 1 and a
      #    `docker compose up` hands 250 documents to ai-service before the demo
      #    is usable. Rows-only means the library is full and the ASSISTANT
      #    RETRIEVES NOTHING — read the header of `apps/backend/src/seed/corpus.ts`
      #    before flipping it, it makes the trade explicit.
      SEED_CORPUS_INGEST: ${SEED_CORPUS_INGEST:-0}
      # ── Public URLs (CORS + token issuer) ──
      # The browser talks to web AND to backend (/admin) directly, so backend
      # must accept both public origins. Required: a localhost default here is
      # how a deployed backend ends up rejecting its own frontend.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required (web + backend public origins, comma-separated)}
      # The `iss` claim. The backend's own public URL.
      AUTH_ISSUER: ${AUTH_ISSUER:?AUTH_ISSUER is required (the backend public URL)}
      # ── Rate limiting ──
      # 🔴 0 = trust NOBODY's X-Forwarded-For. Correct when the container is
      #    reached directly, as it is here. Setting this above the real number
      #    of proxies is a total, silent bypass of every per-IP limit
      #    (apps/backend/src/endpoints/http.ts).
      #    Behind Coolify's Traefik the real number is 1.
      IDENTITY_TRUSTED_PROXY_HOPS: ${IDENTITY_TRUSTED_PROXY_HOPS:-0}
      # ── ☁ OBJECT STORAGE ────────────────────────────────────────────────
      # 🔴 THE FIVE `S3_*` VARIABLES ARE DELIBERATELY **NOT** LISTED HERE, AND
      #    THAT IS THE WIRING, NOT AN OMISSION. They reach this container
      #    through `env_file: .env` above — see `.env.example` §7, where all
      #    five live with working local defaults.
      #
      #    WHY NOT HERE, given every other cross-service value in this file is:
      #    the backend's contract is *"when all five are ABSENT, fall back to
      #    local disk"*. Compose's `environment:` cannot express absent. Write
      #    `S3_ENDPOINT: ${S3_ENDPOINT:-}` and an unset variable arrives as the
      #    EMPTY STRING, which is a different thing, and whether the backend
      #    treats it as off depends on how its check happens to be written.
      #    Through `env_file`, commenting the line out in `.env` means the
      #    variable is genuinely not in the container's environment. One
      #    switch, no ambiguity, and the fallback is reachable by a developer
      #    who wants it.
      #    ⚠ The one thing this costs: `S3_ENDPOINT` must hold a
      #      CONTAINER-NETWORK address (`http://rustfs:9000`), and it now sits
      #      in the same file as host-side ports. Putting `localhost:45410`
      #      there breaks every upload. `.env.example` says so loudly.
      #    ⚠ `web` and `ai-service` also read `.env`, so they see the S3
      #      credentials too. Already true of every value in that file, and
      #      already flagged at the top of it. 🔴 In the fleet, only `backend`
      #      gets them — `infra/fleet/env-manifests.md` §1.
    volumes:
      # 🔴 STILL DECLARED, AND STILL LOAD-BEARING, EVEN WITH RUSTFS RUNNING.
      #    It is the local-disk FALLBACK target: with the five `S3_*` variables
      #    commented out of `.env`, Payload writes here exactly as before.
      #    ⚠ Payload's S3 plugin sets `disableLocalStorage: true` when it is
      #      enabled, so with S3 on, nothing new should land here — but any
      #      code path still doing `fs.readFile(path.resolve(process.cwd(),
      #      'media', …))` reads from this volume and will 404 or silently drop
      #      content. Grep before believing the switch is complete.
      #    🔧 Deleting this volume is a separate, later decision. Keeping it
      #      costs nothing and it is the difference between a bad S3 day being
      #      "revert one env var" and "revert one env var and restore a volume".
      - backend_media:/repo/apps/backend/media
      # The corpus mount is local-only: docker-compose.override.yml.
    expose: ["3002"]
    depends_on:
      postgres:
        condition: service_healthy
      # ⚠ `service_healthy` here buys ONE thing and it is worth being precise:
      #   rustfs's healthcheck is liveness only (see that service), so this
      #   waits until the S3 port is BOUND and nothing more. It removes a
      #   boot-time ECONNREFUSED storm; it does NOT mean the bucket exists or
      #   that a PUT would work. The backend must still tolerate an unusable
      #   store at boot and report it through its OWN readiness route.
      rustfs:
        condition: service_healthy
      # Not `service_healthy`: backend must tolerate ai-service being down
      # (uploads queue, chat degrades). Requiring health here would make an
      # ai-service problem look like a backend outage.
      ai-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3002/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      # Payload's first boot generates the schema and runs the seed. Slow.
      start_period: 120s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  web:
    # SvelteKit, adapter-node. `apps/web/Dockerfile` is ALREADY CORRECT for this
    # compose file — repo-root context, no registry token, workspace-aware. It
    # needs no changes.
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    <<: [*restart, *logging]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # 🔴 REQUIRED. SvelteKit's adapter-node refuses any POST whose `Origin`
      #    header does not match `ORIGIN` exactly, and answers
      #    `403 Cross-site POST form submissions are forbidden`.
      #
      #    ⚠ It only rejects FORM-encoded posts, which is what makes it so
      #    confusing: JSON `fetch` calls sail through, so sign-in, chat, ratings
      #    and session creation all worked while EVERY FILE UPLOAD returned 403.
      #    The UI showed nothing — the document simply never appeared. Found by
      #    the Playwright journey; nothing else in the stack noticed.
      #
      #    ⚠ It must be the URL THE BROWSER USES — the public https URL on
      #    Coolify, the published host port locally. Never the container's
      #    internal 3000. Mismatching them is the same 403.
      #
      #    The prototypes hit this exact wall on a prototype's FE: all three
      #    environments carried a stale prod ORIGIN and every POST 403'd until
      #    it was set per environment. Same failure, written up in their
      #    `ai-infra/coolify-operational.md`.
      ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required (the URL the browser uses for web)}
      # ⚠ These are read via `$env/dynamic/private` — RUNTIME env, not build
      #   args, so one image serves every environment. Do NOT "optimise" them
      #   into build args: Vite SPAs have to build one image per
      #   environment precisely because `import.meta.env.VITE_*` is inlined at
      #   build time. SvelteKit's dynamic/private avoids that trap; keep it.
      #   🔴 Anything renamed to PUBLIC_* becomes build-time-inlined AND
      #      client-visible. Never put a key behind a PUBLIC_ name.
      AI_SERVICE_URL: http://ai-service:3000
      BACKEND_URL: http://backend:3002
    expose: ["3000"]
    depends_on:
      backend:
        condition: service_started
      ai-service:
        condition: service_started
    healthcheck:
      # By contract this route checks nothing downstream — a backend blip must
      # not restart the frontend. (Stated in apps/web/Dockerfile.)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  ai-service:
    # Fastify + Drizzle + BullMQ + pgvector. `services/ai-service/Dockerfile` is
    # ALREADY CORRECT for this compose file and needs no changes.
    #
    # ⚠ Its CMD is `node dist/db/migrate.js && exec node dist/index.js` —
    #   migrations run on EVERY container start, idempotently. That is why it
    #   needs `postgres: service_healthy` and not merely `service_started`.
    build:
      context: ..
      dockerfile: services/ai-service/Dockerfile
    <<: [*restart, *logging]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # ⚠ DATABASE_URL here; DATABASE_URI in backend. Not a typo.
      DATABASE_URL: postgres://${POSTGRES_USER:-edc}:${POSTGRES_PASSWORD}@postgres:5432/${AI_DB_NAME:-edc_ai}
      REDIS_URL: redis://redis:6379
      # 🔴 SAME DRIFT-PROOFING AS audio-service (see that section). The
      #    `callbackSecret` is INTERPOLATED from the single `CALLBACK_SECRET`
      #    variable rather than pasted into a JSON blob in `.env`, because a
      #    pasted copy is the documented #1 failure in this stack: a mismatch
      #    means every ingest callback is rejected and uploads sit in
      #    `embedding` forever, with no error anywhere.
      #    ⚠ This `environment:` value deliberately OVERRIDES anything named
      #      `API_KEYS` in `.env` — Compose gives `environment:` precedence over
      #      `env_file:`. That is why `.env.example` no longer defines it.
      API_KEYS: '{"${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY is required}":{"org":"demo","project":"demo","role":"app","callbackSecret":"${CALLBACK_SECRET:?CALLBACK_SECRET is required}"},"${AI_SERVICE_ADMIN_API_KEY:-dev-key-admin}":{"org":"demo","project":"demo","role":"admin","callbackSecret":"${CALLBACK_SECRET}"}}'
      # ── Advanced RAG: the two optional legs (profile `heavy`) ──
      # Both default OFF, so pointing at a service that is not running is
      # harmless: rerank degrades to a no-op on the fused order, and sparse
      # falls back to the Postgres tsvector lexical leg. Flip the ENABLED flags
      # in `.env` at the same time as you add `--profile heavy`.
      # 🔴 These URLs are consumed VERBATIM — the `/rerank` and `/embed` paths
      #    are part of the value, NOT appended by the client. Dropping the path
      #    yields a 404 that the fallback silently swallows, so the feature
      #    looks enabled and does nothing. Easy to get wrong; check it first.
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_URL: http://rerank-service:8000/rerank
      SPARSE_ENABLED: ${SPARSE_ENABLED:-false}
      SPARSE_EMBED_URL: http://bge-m3-service:8000/embed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        # Embedding batches and BullMQ workers share this process.
        limits: { cpus: "2.0", memory: 2g }

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL — self-hosted inference sidecars (profile: heavy)
  # ═══════════════════════════════════════════════════════════════════════════
  # Both are CPU-only by design and BAKE their weights into the image at build
  # time (see their Dockerfiles), so they need no model volume — but the build
  # itself downloads ~2.3 GB each and needs ~3 GB RAM. Off by default.

  bge-m3-service:
    profiles: ["heavy"]
    build:
      # No workspace deps — its own directory is the correct, much smaller
      # context. This is the exception to the repo-root rule above.
      context: ../services/ai-service/bge-m3-service
    <<: [*restart, *logging]
    expose: ["8000"]
    healthcheck:
      # ⚠ /health is liveness; /ready reports 200 only AFTER the ~2.3 GB model
      #   is loaded into RAM. Probe /ready, or ai-service starts calling a
      #   service that is up and not yet answering.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 240s
      retries: 3
    deploy:
      resources:
        # One worker, one ~2.3 GB model copy in RAM (its Dockerfile is explicit
        # that a second worker doubles that).
        limits: { cpus: "4.0", memory: 4g }

  rerank-service:
    profiles: ["heavy"]
    build:
      context: ../services/ai-service/rerank-service
    <<: [*restart, *logging]
    expose: ["8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 240s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 4g }

# ═══════════════════════════════════════════════════════════════════════════
volumes:
  pg_data:          # Postgres cluster — both databases.
  redis_data:       # BullMQ queue state (appendonly).
  backend_media:    # Payload uploads — the LOCAL-DISK FALLBACK now. See §rustfs.

  # ── ☁ rustfs_data — 🔴 TWO DIFFERENT THINGS LIVE IN HERE ────────────────
  # 1. The BUCKET DATA. The uploaded PDFs, DOCX and audio. Precious.
  # 2. The IAM STORE. Users, access keys, policies — including `users.json`,
  #    which holds SECRET KEYS IN CLEARTEXT on disk. There is no env var that
  #    seeds a user or a policy; the only thing the environment can set is the
  #    single ROOT key pair. Everything else is created through the admin API
  #    against a running server and then lives here and nowhere else.
  #
  # 🔴 THE BACKUP GAP, STATED PLAINLY: restoring this volume brings the buckets
  #    back. It does NOT bring back an IAM store that matches whatever the app
  #    is currently configured with — restore an older copy and you restore the
  #    keys that were valid then. A key rotated since the snapshot comes back
  #    dead, and the app authenticates against a store that has silently moved
  #    backwards. `infra/fleet/backups.md` §2 carries the full version.
  # ✅ THE MITIGATION IS PROVISIONING, NOT BACKUP. The bucket-and-credential
  #    provisioning must be IDEMPOTENT and RE-RUNNABLE on every boot, so that a
  #    restored, wiped or half-populated IAM store converges to the right shape
  #    without a human. 🔴 A one-shot init container that exits is exactly the
  #    approach recorded as failing: it runs once against an empty volume and is
  #    never there on the day the store comes back wrong. That script is owned
  #    by `apps/backend/**` (another agent); this file's job is only to make
  #    sure the server is up, reachable and holding stable root credentials when
  #    it runs.
  # ⚠ `docker compose down -v` deletes uploads AND every issued credential.
  rustfs_data:


# =============================================================================
# APPENDIX — things this file DEPENDS ON that I do not own
# =============================================================================
#
# ─── Root `.dockerignore` — OWNED BY THE INTEGRATOR, already written ────────
# Not mine to create. This compose file only depends on it excluding `.git`,
# `node_modules`, `**/node_modules`, `**/dist` and every `.env` — and on it NOT
# excluding `pnpm-lock.yaml`, `pnpm-workspace.yaml` or any `package.json`, all
# of which the workspace-aware builds COPY explicitly.
# ⚠ `infra/.env` must be excluded too, or it lands in an image layer.
#
# ─── Dockerfiles — status as of writing (NONE ARE MINE TO EDIT) ─────────────
#  ✅ `apps/web/Dockerfile{,.dev}`          correct. Repo-root context, pnpm,
#                                          no registry token. No change needed.
#  ✅ `services/ai-service/Dockerfile{,.dev}`  correct. Copies all SIX workspace
#                                          manifests — the reference to copy.
#  ✅ `apps/backend/Dockerfile{,.dev}`      REWRITTEN mid-flight by another
#                                          agent; now repo-root context, pnpm,
#                                          `ENV PORT=3002`, no `REGISTRY_PAT`.
#                                          One residual risk noted on the
#                                          `backend` service above: it copies
#                                          only four of six manifests.
#  ✅ `services/audio-service/Dockerfile`   EXISTS AND IS REAL. Read, not
#                                          assumed. Python 3.11-slim, ffmpeg +
#                                          libgomp1 + curl, no torch, no CUDA,
#                                          weights baked, `HF_HUB_OFFLINE=1`.
#                                          🔴 Its context is the SERVICE dir,
#                                          not the repo root — the deliberate
#                                          exception to the rule above. It has
#                                          no `package.json` on purpose, so it
#                                          is NOT a pnpm workspace member and
#                                          the lockfile does not apply to it.
#
# ⚠ `apps/backend/.dockerignore` and `apps/web/.dockerignore` are INERT — the
#   context root is the repo root, so only `/.dockerignore` is read. Their
#   entries (notably `src/payload-types.ts`, `media`) must live in the root one.
#
# ─── 🔴 `packages/*/dist` — nobody builds it ────────────────────────────────
# `@edc/ai-client`, `@edc/chat-engine` and `@edc/identity-client` all publish
# `main`/`types` pointing at `dist/`, and all three have their own `build`
# script. **No Dockerfile runs `pnpm -r build`.** The app builds may resolve
# them by chance (via source or a bundler) or may fail with
# `ERR_MODULE_NOT_FOUND` on a bare `@edc/…` import. ⚠ **Unverified — I could
# not build.** Whoever runs the first image build should check this first; the
# fix is one `RUN pnpm --filter @edc/backend^... build` before the app build.
#
# ─── `apps/backend/docker-compose.yml` ──────────────────────────────────────
# Superseded by this file. It stands up a SECOND Postgres on host 5433 with
# `edc_backend_dev` — still plain
# `postgres:16-alpine` with **no pgvector**, and still a competing instance.
# Recommend DELETE, and repoint `apps/backend/package.json`'s
# `docker:up`/`docker:down`/`docker:reset` at this file.
#
# ─── Known to be wrong / unverified today ───────────────────────────────────
#  ✅ `pnpm-lock.yaml` NOW EXISTS at the repo root (it did not when the first
#     draft of this file was written). Every Dockerfile's `--frozen-lockfile` is
#     therefore satisfiable. Not verified by an actual build.
#  ✅ `services/audio-service/` NOW EXISTS and this file has been reconciled
#     against it. The three-container shape, the `audio_work` volume, the baked
#     weights and the `API_KEYS` shape are READ FROM ITS SOURCE, not assumed.
#  🔴 `apps/backend` DOES NOT YET CONSUME `AUDIO_SERVICE_URL` /
#     `AUDIO_SERVICE_API_KEY`, and its callback route does not branch on
#     `transcribe.*` — it logs an unknown event and returns 200. So today the
#     audio containers come up, accept an upload via curl, transcribe it and
#     deliver a signed callback that the backend accepts and ignores. The
#     end-to-end product path lands with `plan/audio-ingest-integration.md`.
#     ⚠ This is the assumption in this file most likely to break: if that agent
#       chooses different variable names, change the two lines on `backend`.
#  🔴 The identity provider needs a signing keypair (`AUTH_PRIVATE_KEY` /
#     `AUTH_PUBLIC_KEY` / `AUTH_KEY_ID` / `AUTH_ISSUER`). There is no default
#     and none is generated automatically. Generate once with
#     `pnpm --filter @edc/backend keygen` and paste into `.env` — see
#     `.env.example` §3. Without it the app boots but cannot mint a token.
#  🔴 `apps/backend` DOES NOT YET HAVE AN S3 ADAPTER. As of this edit the five
#     `S3_*` variables in `.env.example` are read by NOTHING — no
#     `@payloadcms/storage-s3` in `apps/backend/package.json`, no S3 config in
#     `payload.config.ts`. Another agent is landing the adapter, the
#     provisioning and the `HeadBucket` readiness probe. Until that lands,
#     `rustfs` comes up, answers S3 correctly, holds an empty store, and every
#     upload still goes to `backend_media`. ⚠ Same shape and same trade as the
#     `AUDIO_SERVICE_*` note above: setting an unread variable costs nothing,
#     and the alternative is a second edit to this file.
#     🔴 If that agent picks different variable names, `.env.example` §7 and
#        the `backend` comment block change together.
#  ⚠ THE BUCKET IS NOT CREATED BY THIS FILE. RustFS has NO "default bucket"
#     environment variable — verified against the running container; only
#     `RUSTFS_ACCESS_KEY` / `_SECRET_KEY` / `_VOLUMES` / `_ADDRESS` exist.
#     Creating `S3_BUCKET` is provisioning, and provisioning is the backend's.
#     ⚠ Do not assume otherwise from the fleet doc: Garage — the engine
#       `infra/fleet/topology.md` §3 names for self-hosted stage/prod — DOES
#       have `GARAGE_DEFAULT_BUCKET`. RustFS does not.
#  ⚠ No image tag, port, healthcheck path or resource limit in this file has
#     been executed, WITH ONE EXCEPTION: `rustfs`, whose ✅ MEASURED notes are
#     on the service itself. `/api/health` (backend, web), `/health`
#     (ai-service), `/ready` (sidecars) are read from source, not curled.
#  ⚠ Other agents are editing package scripts and env names concurrently. If a
#     variable name here does not match the code, the code is right.
