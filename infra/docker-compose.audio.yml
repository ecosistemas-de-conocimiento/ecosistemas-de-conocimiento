# Ecosistemas de Conocimiento — AUDIO TRANSCRIPTION, local overlay
# =============================================================================
#
# The three audio containers live in docker-compose.yml under the profile
# `audio` (dev on edc-1 turns it on with COMPOSE_PROFILES=audio; see that file
# and infra/fleet/edc-1.md §4y). Locally, turn the profile on and add this file:
#
#   docker compose --profile audio -f docker-compose.yml \
#                  -f docker-compose.override.yml \
#                  -f docker-compose.audio.yml up -d --wait
#
# This overlay sets the backend's audio wiring and REQUIRES the key — `config`
# fails loudly if it is missing, so "audio on but unconfigured" cannot happen
# silently. Without the profile the backend runs with audio OFF.
#
# ⚠ The host port below is for local use only. Coolify never loads this file.

services:

  backend:
    environment:
      AUDIO_SERVICE_URL: http://audio-service:8080
      AUDIO_SERVICE_API_KEY: ${AUDIO_SERVICE_API_KEY:?AUDIO_SERVICE_API_KEY is required when audio is on}

  audio-service:
    ports:
      # Curl it from the host. Never on Coolify (two envs, one box).
      - "${AUDIO_HOST_PORT:-45403}:8080"
